[tool.poetry]
name = "evolution-forge"
version = "1.0.1"
description = "Exploratory agent-based evolution and astrobiology scenario models for Matrixgame"
authors = ["Matrixgame contributors"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
numpy = "^2.1"
matplotlib = "^3.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
