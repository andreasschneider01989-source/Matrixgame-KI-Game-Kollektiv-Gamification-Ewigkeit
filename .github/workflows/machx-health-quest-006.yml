name: MACHX Health Quest 006

on:
  pull_request:
    paths:
      - "matrixgame_science/**"
      - "tests/test_closed_loop_learning.py"
      - ".github/workflows/machx-health-quest-006.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closed-loop-learning:
    runs-on: ubuntu-latest
    steps:
      - name: Check out focused Python package and tests
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            matrixgame_science
            tests/test_closed_loop_learning.py
          sparse-checkout-cone-mode: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run closed-loop tests
        run: python -m pytest -q tests/test_closed_loop_learning.py
