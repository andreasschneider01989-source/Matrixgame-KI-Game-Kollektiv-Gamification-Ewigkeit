name: Matrixgame research and protocol contract tests

on:
  pull_request:
    paths:
      - "matrixgame-protocol/artifact-envelope.schema.json"
      - "matrixgame-protocol/artifact-envelope.example.json"
      - "matrixgame-protocol/quest.schema.json"
      - "matrixgame-protocol/quest.example.json"
      - "research/MATRIXGAME_SOCIAL_CONNECTION_AND_SAFETY_2026-11-25.json"
      - "research/MATRIXGAME_ENERGY_AND_RESOURCE_OPTIMIZATION_2026-11-25.json"
      - "tests/test_artifact_envelope_contract.py"
      - "tests/test_quest_contract.py"
      - "tests/test_social_connection_snapshot.py"
      - "tests/test_energy_resource_snapshot.py"
      - ".github/workflows/matrixgame-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The historical archive contains oversized legacy filenames.
          # Sparse checkout keeps this focused contract job independent of them.
          sparse-checkout: |
            matrixgame-protocol/artifact-envelope.schema.json
            matrixgame-protocol/artifact-envelope.example.json
            matrixgame-protocol/quest.schema.json
            matrixgame-protocol/quest.example.json
            research/MATRIXGAME_SOCIAL_CONNECTION_AND_SAFETY_2026-11-25.json
            research/MATRIXGAME_ENERGY_AND_RESOURCE_OPTIMIZATION_2026-11-25.json
            tests/test_artifact_envelope_contract.py
            tests/test_quest_contract.py
            tests/test_social_connection_snapshot.py
            tests/test_energy_resource_snapshot.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run protocol and research contract tests
        run: >-
          python -m pytest -q
          tests/test_artifact_envelope_contract.py
          tests/test_quest_contract.py
          tests/test_social_connection_snapshot.py
          tests/test_energy_resource_snapshot.py
