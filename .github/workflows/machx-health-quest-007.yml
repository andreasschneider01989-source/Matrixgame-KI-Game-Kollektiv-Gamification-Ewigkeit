name: MACHX Health Quest 007

on:
  pull_request:
    paths:
      - "matrixgame_science/**"
      - "tests/test_physics_guided_learning.py"
      - ".github/workflows/machx-health-quest-007.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics-guided-neuron:
    runs-on: ubuntu-latest
    steps:
      - name: Check out only the Python package and focused test
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /matrixgame_science/
            /tests/test_physics_guided_learning.py
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run physics-guided tests
        run: python -m pytest -q tests/test_physics_guided_learning.py
