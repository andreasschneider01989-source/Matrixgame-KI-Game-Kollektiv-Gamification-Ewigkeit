name: MACHX Health Quest 009

on:
  pull_request:
    paths:
      - "matrixgame_science/**"
      - "tests/test_physics_validation.py"
      - ".github/workflows/machx-health-quest-009.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse checkout of package and focused test
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /matrixgame_science/
            /tests/test_physics_validation.py
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Run physics validation tests
        run: python -m pytest -q tests/test_physics_validation.py
