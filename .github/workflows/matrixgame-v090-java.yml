name: Matrixgame Universal Grid Lab v0.9.0

on:
  pull_request:
    branches:
      - fix/v089-reliable-depot-actions
    paths:
      - "src/rhgr/MatrixgameUniversalGridLab_v09_0.java"
      - ".github/workflows/matrixgame-v090-java.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only the candidate Java source
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/rhgr/MatrixgameUniversalGridLab_v09_0.java
          sparse-checkout-cone-mode: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile with warnings treated as errors
        run: |
          mkdir -p out
          javac -encoding UTF-8 -Xlint:all -Werror -d out src/rhgr/MatrixgameUniversalGridLab_v09_0.java

      - name: Run deterministic headless self-tests
        run: |
          java -Djava.awt.headless=true -cp out rhgr.MatrixgameUniversalGridLab_v09_0 --self-test
