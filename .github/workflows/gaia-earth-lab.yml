name: Gaia Earth Lab

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "matrixgame-earth-lab/**"
      - ".github/workflows/gaia-earth-lab.yml"
  push:
    branches: [main]
    paths:
      - "matrixgame-earth-lab/**"
      - ".github/workflows/gaia-earth-lab.yml"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download only Gaia Earth Lab files
        env:
          SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          files=(
            matrixgame-earth-lab/src/main/java/de/matrixgame/earth/GaiaWaterBucket.java
            matrixgame-earth-lab/src/main/java/de/matrixgame/earth/GaiaWaterBucketDemo.java
            matrixgame-earth-lab/src/main/java/de/matrixgame/earth/GaiaReviewCouncil.java
            matrixgame-earth-lab/src/test/java/de/matrixgame/earth/GaiaWaterBucketSelfTest.java
            matrixgame-earth-lab/build.sh
            matrixgame-earth-lab/test.sh
            matrixgame-earth-lab/run.sh
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$file?ref=$SOURCE_REF" \
              --output "$file"
          done
      - name: Compile and run self-tests
        working-directory: matrixgame-earth-lab
        run: sh test.sh
      - name: Run synthetic demonstration
        working-directory: matrixgame-earth-lab
        run: sh run.sh
