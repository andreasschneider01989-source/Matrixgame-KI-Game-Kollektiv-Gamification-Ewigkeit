name: Matrixgame Universal Grid Lab v0.11.0

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/rhgr/MatrixgameUniversalGridLab_v11_0.java"
      - ".github/workflows/matrixgame-v110-java.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate Java source only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/rhgr/MatrixgameUniversalGridLab_v11_0.java
          sparse-checkout-cone-mode: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out src/rhgr/MatrixgameUniversalGridLab_v11_0.java

      - name: Run deterministic self-tests
        run: |
          java -Djava.awt.headless=true -cp out rhgr.MatrixgameUniversalGridLab_v11_0 --self-test

      - name: Run the 306-tick headless Canvas simulation
        run: |
          java -Djava.awt.headless=true -cp out rhgr.MatrixgameUniversalGridLab_v11_0 --simulate 306 20261116 160 100 matrixgame-report.html | tee matrixgame-run.txt
          test -s matrixgame-report.html
          grep -q 'canvas id="world"' matrixgame-report.html

      - name: Upload interactive simulation report
        uses: actions/upload-artifact@v4
        with:
          name: matrixgame-v11-browser-canvas-report
          path: |
            matrixgame-report.html
            matrixgame-run.txt
          if-no-files-found: error
          retention-days: 30
