name: Research artifact validation

on:
  pull_request:
    paths:
      - "schemas/**"
      - "examples/**"
      - "scripts/validate_research_artifacts.py"
      - "requirements-validation.txt"
      - ".github/workflows/research-artifact-validation.yml"
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "examples/**"
      - "scripts/validate_research_artifacts.py"
      - "requirements-validation.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Sparse checkout avoids unrelated legacy root files with path names
      # that exceed Windows/Linux checkout limits. Only validator inputs are needed.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/research-artifact-validation.yml
            schemas
            examples
            scripts
            requirements-validation.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-validation.txt
      - name: Install pinned validator
        run: python -m pip install -r requirements-validation.txt
      - name: Validate schema and fixtures
        run: python scripts/validate_research_artifacts.py
