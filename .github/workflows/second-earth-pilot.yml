name: Second Earth pilot

on:
  pull_request:
    paths:
      - "second-earth/**"
      - ".github/workflows/second-earth-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse checkout of pilot only
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          printf '/second-earth/**\n' > .git/info/sparse-checkout
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --depth=1 "https://github.com/${REPOSITORY}.git" "${REF}"
          git checkout --detach FETCH_HEAD
      - name: Run unit tests
        run: python3 -m unittest discover -s second-earth -p "test_*.py" -v
      - name: Run reproducible 30-seed experiment
        run: |
          python3 second-earth/simulate.py \
            --config second-earth/config/valley-001.json \
            --seeds 30 \
            --output /tmp/valley-001-summary.json
          test -s /tmp/valley-001-summary.json
