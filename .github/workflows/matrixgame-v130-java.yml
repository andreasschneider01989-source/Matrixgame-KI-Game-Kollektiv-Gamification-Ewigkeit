name: Matrixgame Universal Grid Lab v0.13.0

on:
  pull_request:
    branches:
      - main
      - feature/matrixgame-v0120-ecology-infinity
    paths:
      - "src/rhgr/MatrixgameUniversalGridLab_v13_0.java"
      - ".github/workflows/matrixgame-v130-java.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout v0.13.0 source
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/rhgr/MatrixgameUniversalGridLab_v13_0.java
          sparse-checkout-cone-mode: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out src/rhgr/MatrixgameUniversalGridLab_v13_0.java

      - name: Run deterministic self-tests
        run: |
          java -Djava.awt.headless=true -cp out rhgr.MatrixgameUniversalGridLab_v13_0 --self-test

      - name: Run enlarged-world simulation
        run: |
          java -Djava.awt.headless=true -cp out rhgr.MatrixgameUniversalGridLab_v13_0 --simulate 500 20261116 320 200 matrixgame-v13-report.html | tee matrixgame-v13-run.txt
          test -s matrixgame-v13-report.html
          grep -q 'canvas id="world"' matrixgame-v13-report.html
          {
            echo "## Matrixgame v0.13.0 – Large World"
            echo
            echo '### 320×200 / 500-tick headless simulation'
            echo '~~~text'
            cat matrixgame-v13-run.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML Canvas report
        uses: actions/upload-artifact@v4
        with:
          name: matrixgame-v13-large-world-report
          path: |
            matrixgame-v13-report.html
            matrixgame-v13-run.txt
          if-no-files-found: error
          retention-days: 30
