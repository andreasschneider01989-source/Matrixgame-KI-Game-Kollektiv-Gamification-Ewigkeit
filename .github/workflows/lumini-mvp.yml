name: LUMINI MVP

on:
  pull_request:
    paths:
      - "matrixgame-language/**"
      - ".github/workflows/lumini-mvp.yml"
  push:
    branches: [main]
    paths:
      - "matrixgame-language/**"
      - ".github/workflows/lumini-mvp.yml"

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download only LUMINI source files
        env:
          SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          files=(
            matrixgame-language/src/main/java/de/matrixgame/language/LuminiCompiler.java
            matrixgame-language/src/test/java/de/matrixgame/language/LuminiCompilerSelfTest.java
            matrixgame-language/examples/density.lumini
            matrixgame-language/examples/invalid-units.lumini
            matrixgame-language/build.sh
            matrixgame-language/test.sh
            matrixgame-language/run.sh
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$file?ref=$SOURCE_REF" \
              --output "$file"
          done
      - name: Compile and run self-tests
        working-directory: matrixgame-language
        run: sh test.sh
      - name: Compile the valid example to Model IR
        working-directory: matrixgame-language
        run: sh run.sh examples/density.lumini --out build/density-model-ir.json
