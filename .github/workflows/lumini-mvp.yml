name: LUMINI MVP

on:
  pull_request:
    paths:
      - "matrixgame-language/**"
      - ".github/workflows/lumini-mvp.yml"
  push:
    branches: [main]
    paths:
      - "matrixgame-language/**"
      - ".github/workflows/lumini-mvp.yml"

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile and run self-tests
        working-directory: matrixgame-language
        run: sh test.sh
      - name: Compile the valid example to Model IR
        working-directory: matrixgame-language
        run: sh run.sh examples/density.lumini --out build/density-model-ir.json
