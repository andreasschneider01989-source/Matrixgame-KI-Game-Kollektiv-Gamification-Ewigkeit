# Scoped Python validation for the Evolution Forge module.
name: Python application

on:
  push:
    branches: ["main", "feature/evolution-forge-bridge"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Python module only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.github/workflows/
            /python/evolution_forge/
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.1,<3" "matplotlib>=3.9,<4" "flake8>=7" "pytest>=8.3,<9"

      - name: Lint Python syntax and undefined names
        run: flake8 python/evolution_forge --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test Evolution Forge
        env:
          PYTHONPATH: python/evolution_forge
        run: python -m pytest -q python/evolution_forge/tests
