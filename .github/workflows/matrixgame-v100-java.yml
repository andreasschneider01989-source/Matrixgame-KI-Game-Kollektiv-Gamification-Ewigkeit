name: Matrixgame Universal Grid Lab v0.10.0

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/rhgr/MatrixgameUniversalGridLab_v10_0.java"
      - ".github/workflows/matrixgame-v100-java.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate Java source only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/rhgr/MatrixgameUniversalGridLab_v10_0.java
          sparse-checkout-cone-mode: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out src/rhgr/MatrixgameUniversalGridLab_v10_0.java

      - name: Run deterministic self-tests
        run: |
          java -Djava.awt.headless=true -cp out rhgr.MatrixgameUniversalGridLab_v10_0 --self-test
