name: LIFE Quest 010 — Perception-Gated Decisions

on:
  pull_request:
    paths:
      - "matrixgame_science/agent_decision.py"
      - "tests/test_agent_decision.py"
      - "docs/LIFE_QUEST_010_PERCEPTION_GATED_ACTIONS.md"
      - ".github/workflows/life-quest-010.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perception-gated-decisions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout focused source and tests
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /matrixgame_science/
            /tests/test_agent_decision.py
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Run LIFE Quest 010 tests
        run: python -m pytest -q tests/test_agent_decision.py
