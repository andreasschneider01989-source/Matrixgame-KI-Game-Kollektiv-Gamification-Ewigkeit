[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrixgame-science"
version = "0.1.0"
description = "Transparent scientific model primitives for Matrixgame"
readme = "matrixgame_science/README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Matrixgame contributors"}]
dependencies = []

[tool.setuptools.packages.find]
include = ["matrixgame_science*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
